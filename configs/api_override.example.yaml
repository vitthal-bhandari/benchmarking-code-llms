# Template for the per-run vLLM endpoint override consumed by
# scripts/run_swebench_agent.slurm / serve_and_run_swebench.slurm (via `-c`).
# Copy to configs/api_override.yaml (gitignored) and set api_base to the node
# your server landed on.
#
# No temperature/top_p set here on purpose: mini-swe-agent's own swebench.yaml
# sends none either (confirmed by reading the live config), so omitting it lets
# vLLM fall through to the model's own generation_config.json defaults (Qwen3.6
# ships temperature=1.0, top_k=20, top_p=0.95 there — the vendor-recommended
# setting, and the regime the published 73.4% figure uses). An earlier run
# force-set temperature=0 for determinism; that was a self-imposed choice, not
# something any framework required, and greedy decoding has a plausible causal
# link to the repeated-step-limit-loop failures observed in that run. Add
# `temperature: 0` back under model_kwargs only if you deliberately want
# determinism and are prepared for that tradeoff.
#
#   squeue --me            # find the server node, e.g. g3130
#   grep "Application startup complete" logs/vllm_serve_inline_<jobid>.log
#
model:
  model_kwargs:
    api_base: http://<node>:8000/v1
