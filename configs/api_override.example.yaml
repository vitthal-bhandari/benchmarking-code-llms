# Template for the per-run vLLM endpoint override consumed by
# scripts/run_swebench_agent.slurm (via `-c`). Copy to configs/api_override.yaml
# (gitignored) and set api_base to the node your serve_vllm.slurm job landed on.
# `temperature: 0` makes runs deterministic; drop it to sample at the model's
# generation_config default.
#
#   squeue --me            # find the vllm_serve node, e.g. g3130
#   grep "Application startup complete" logs/vllm_serve_<jobid>.out
#
model:
  model_kwargs:
    api_base: http://<node>:8000/v1
    temperature: 0
